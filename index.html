<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 — Một thời để nhớ</title><style>@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');*{box-sizing:border-box}body{margin:0;background:#f3ede1;color:#29483c;font:15px/1.7 'Be Vietnam Pro',sans-serif}header,footer{text-align:center;padding:65px 20px}h1,h2{font-family:'Playfair Display',Georgia,serif}h1{font-size:clamp(44px,8vw,96px);line-height:1.1;margin:20px 0;font-style:italic}main{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.tile{padding:32px;border-radius:24px;min-height:220px;background:#e8d2ae;color:#493c30}.tile:nth-child(3n){background:#cbd5c5}.tile:nth-child(3n+1){background:#29483c;color:#fff9eb}.tile:first-child,.tile:last-child{grid-column:1/-1}.tile h2{font-size:32px;margin:10px 0}button,input,textarea,select{font:inherit;border-radius:9px;padding:10px;border:1px solid #aaa}button{cursor:pointer;background:#fff9eb;color:#29483c}dialog{border:0;border-radius:20px;width:min(700px,94vw);max-height:85vh;overflow:auto;background:#fffaf0;color:#29483c;padding:25px}dialog::backdrop{background:#182c26aa}form{display:grid;gap:12px}article{border-top:1px solid #ccc;padding:20px 0;white-space:pre-wrap}article img{max-width:100%;border-radius:12px}small{letter-spacing:2px}#status{white-space:pre-wrap} @media(max-width:600px){main{grid-template-columns:1fr}.tile{grid-column:1!important;padding:24px}}</style><header><small>A1 · K26 · HH3 / 2024 — 2027</small><h1>Một thời để nhớ.</h1><p>Cất giữ những ngày bình thường mà sau này trở nên vô giá.</p></header><main id="grid"></main><footer><h2>Hẹn ngày gặp lại.</h2><p>Thanh xuân có hạn. Ký ức thì không.</p><button id="login">🔒 Góc quản trị</button> <button id="logout" hidden>Đăng xuất</button><p id="status" role="status"></p></footer><dialog id="chapter"><button id="close">Đóng ×</button><h2 id="heading"></h2><button id="add" hidden>+ Thêm kỷ niệm</button><div id="posts"></div></dialog><dialog id="authbox"><form id="authform"><h2>Góc quản trị</h2><input id="email" type="email" placeholder="Email quản trị" required><input id="password" type="password" placeholder="Mật khẩu" required><button>Đăng nhập</button><button type="button" onclick="this.closest('dialog').close()">Hủy</button><p id="autherror"></p></form></dialog><dialog id="editor"><form id="editform"><h2>Biên tập kỷ niệm</h2><input id="title" placeholder="Tiêu đề" required maxlength="200"><input id="date" type="date"><textarea id="body" rows="8" placeholder="Câu chuyện của chúng mình..." required></textarea><input id="photo" type="url" placeholder="Đường dẫn HTTPS đến ảnh (tùy chọn)"><button>Lưu nội dung</button><button type="button" onclick="this.closest('dialog').close()">Hủy</button><p id="editerror"></p></form></dialog><script type="module">
const config={apiKey:'AIzaSyCAN7gRIPj2i1gXUKWFV5a0nVGcqb1EzbY',authDomain:'a1-k26-hh3-772c4.firebaseapp.com',projectId:'a1-k26-hh3-772c4',appId:'1:45550733756:web:43806fd2da39c7278103b9'};
const adminUid='Nr47QQLscbRxgvjJKdNP2fDuw7C2';
const $=id=>document.getElementById(id);const chapters=[['Trạm ký ức','Những khoảnh khắc chẳng thể gọi tên.'],['Một thời để nhớ','Hành trình ba năm qua từng dấu mốc.'],['Những mảnh ghép','Mỗi người là một sắc màu của A1.'],['Thước phim năm ấy','Những khung hình lưu giữ tuổi trẻ.'],['Người gieo nắng','Dành cho những người thầy, người cô.'],['Điều chưa kịp nói','Những lời cảm ơn và lời nhắn gửi.'],['Thanh âm tuổi trẻ','Những giai điệu của năm tháng học trò.'],['Gửi chúng ta của ngày mai','Những lời nhắn dành cho tương lai.']];let active=0,editing=null,admin=false,records=[],save,remove,signin,signout;
function el(tag,txt){const n=document.createElement(tag);n.textContent=txt;return n}chapters.forEach(([name,desc],i)=>{const t=el('section','');t.className='tile';t.append(el('small',`CHƯƠNG ${String(i+1).padStart(2,'0')}`),el('h2',name),el('p',desc));const b=el('button','Mở mảnh ghép →');b.onclick=()=>{active=i;$('heading').textContent=name;render();$('chapter').showModal()};t.append(b);$('grid').append(t)});
function render(){$('posts').replaceChildren();$('add').hidden=!admin;const list=records.filter(p=>p.chapter===active).sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!list.length)$('posts').append(el('p','Trang ký ức này đang chờ được viết tiếp.'));for(const p of list){const a=el('article','');a.append(el('small',p.date||''),el('h2',p.title),el('p',p.body));if(p.photo&&p.photo.startsWith('https://')){const img=el('img','');img.src=p.photo;img.alt=p.title;img.loading='lazy';a.append(img)}if(admin){const e=el('button','Sửa');e.onclick=()=>edit(p);const d=el('button','Xóa');d.onclick=async()=>{if(confirm('Xóa kỷ niệm này?'))try{await remove(p.id)}catch(err){alert(err.message)}};a.append(e,d)}$('posts').append(a)}}
function edit(p={}){editing=p.id||null;for(const k of ['title','date','body','photo'])$(k).value=p[k]||'';$('editerror').textContent='';$('editor').showModal()}
$('close').onclick=()=>$('chapter').close();$('add').onclick=()=>edit();$('login').onclick=()=>$('authbox').showModal();$('logout').onclick=()=>signout?.();$('authform').onsubmit=async e=>{e.preventDefault();try{if(!signin)throw Error('Chưa cấu hình Firebase.');await signin($('email').value,$('password').value);$('password').value='';$('authbox').close()}catch(err){$('autherror').textContent=err.message}};$('editform').onsubmit=async e=>{e.preventDefault();try{if(!admin)throw Error('Không có quyền quản trị');const p={chapter:active};for(const k of ['title','date','body','photo'])p[k]=$(k).value;if(p.photo&&!p.photo.startsWith('https://'))throw Error('Ảnh phải dùng HTTPS');await save(editing,p);$('editor').close()}catch(err){$('editerror').textContent=err.message}};
if(config.apiKey.startsWith('THAY')){$('status').textContent='Bản xem trước — chưa kết nối cơ sở dữ liệu.'}else try{const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');const {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');const {getFirestore,collection,onSnapshot,addDoc,doc,updateDoc,deleteDoc}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),col=collection(db,'memories');signin=(e,p)=>signInWithEmailAndPassword(auth,e,p);signout=()=>signOut(auth);save=(id,p)=>id?updateDoc(doc(col,id),p):addDoc(col,p);remove=id=>deleteDoc(doc(col,id));onAuthStateChanged(auth,u=>{admin=u?.uid===adminUid;$('logout').hidden=!u;$('login').hidden=!!u;$('status').textContent=admin?'Đang ở chế độ quản trị':u?'Tài khoản không có quyền quản trị':'';render()});onSnapshot(col,s=>{records=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>$('status').textContent=e.message)}catch(e){$('status').textContent=e.message}
</script></html>
